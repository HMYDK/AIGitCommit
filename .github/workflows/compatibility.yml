name: IDE Compatibility

on:
  workflow_dispatch:
  pull_request:
    branches: [ "main", "master" ]
  push:
    branches: [ "main", "master" ]
  schedule:
    - cron: "17 2 * * 1"

permissions:
  contents: read
  issues: write

jobs:
  verify:
    name: Verify ${{ matrix.profile }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile:
          - minimum
          - stable
          - eap

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "corretto"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build plugin
        run: ./gradlew buildPlugin

      - name: Run Plugin Verifier
        run: ./gradlew verifyPlugin -PcompatibilityProfile=${{ matrix.profile }}

      - name: Upload verifier report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compatibility-${{ matrix.profile }}-${{ github.run_id }}
          path: build/reports/pluginVerifier/
          if-no-files-found: warn

  report-scheduled-failure:
    name: Report scheduled compatibility failure
    if: ${{ always() && github.event_name == 'schedule' && needs.verify.result == 'failure' }}
    needs: verify
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Create one tracking issue
        shell: bash
        run: |
          title="[automated] IDE compatibility check failed"
          existing="$(gh issue list \
            --state open \
            --search "\"$title\" in:title" \
            --json number \
            --jq 'length')"

          if [ "$existing" = "0" ]; then
            gh issue create \
              --title "$title" \
              --body "The scheduled IntelliJ Plugin Verifier run failed. Review workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          fi
